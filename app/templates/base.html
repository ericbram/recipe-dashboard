<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipes{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <nav>
    <a href="/">Recipes</a>
    <a href="/plan">This week</a>
    <a href="/kitchen">Kitchen</a>
    <a href="/recipe/new" class="primary">Add recipe</a>
  </nav>
  <div id="flash" class="error" role="alert" hidden></div>
  <main>{% block content %}{% endblock %}</main>
  <script>
    document.body.addEventListener('htmx:responseError', function (e) {
      var flash = document.getElementById('flash');
      flash.textContent = e.detail.xhr.responseText || ('Error ' + e.detail.xhr.status);
      flash.hidden = false;
    });
    document.body.addEventListener('htmx:beforeRequest', function () {
      document.getElementById('flash').hidden = true;
    });
  </script>
</body>
</html>
