name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated; the image installs pure-Python wheels, so nothing compiles.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # pi-stack is the Pi's desired state; pointing it at this build is the deploy.
  # Needs PI_STACK_DEPLOY_KEY: a write deploy key on ericbram/pi-stack.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    concurrency: pi-stack-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ericbram/pi-stack
          ssh-key: ${{ secrets.PI_STACK_DEPLOY_KEY }}

      - name: Point pi-stack at this build
        run: |
          tag="sha-${GITHUB_SHA::7}"
          sed -E -i "s#(ghcr.io/ericbram/recipe-dashboard:)[^[:space:]]+#\1${tag}#" compose.yml
          git diff --quiet && { echo "already on $tag"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
          git commit -qam "recipes: $tag"
          # Someone may have pushed to pi-stack meanwhile; rebase once and retry.
          git push || { git pull --rebase -q && git push; }
