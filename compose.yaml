# Local development only. Production lives in the pi-stack repo, behind Caddy
# and oauth2-proxy against the shared Postgres.
services:
  recipes:
    build: .
    ports:
      - "8000:8000"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: dev
      PGDATABASE: recipes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Throwaway: no host mount, so `docker compose down -v` gives a clean slate.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: recipes
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
